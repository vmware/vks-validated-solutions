# RING connection used by the Scality COSI driver for provisioning.
# Replace the placeholders. Add tlsCert (PEM) if the endpoint uses a private CA.
apiVersion: v1
kind: Secret
metadata:
  name: scality-ring-cosi
  namespace: container-object-storage-system
type: Opaque
stringData:
  accessKeyId: <ACCESS_KEY_ID>
  secretAccessKey: <SECRET_ACCESS_KEY>
  endpoint: https://s3.example.com
  iamEndpoint: https://s3.example.com
  region: us-east-1
