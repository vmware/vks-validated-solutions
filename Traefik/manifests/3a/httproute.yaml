# The HTTPRoute echo-http: echo.example.com to the Service echo,
# on both listeners of the Gateway traefik.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-http
  namespace: traefik
spec:
  parentRefs:
    - name: traefik
  hostnames:
    - echo.example.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: echo
          port: 1027
