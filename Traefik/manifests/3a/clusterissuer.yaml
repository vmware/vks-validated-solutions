# A private CA for the validation: a self-signed root (traefik-root-ca) and the
# ClusterIssuer traefik-ca that signs with it. In production, use your own issuer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: traefik-root-ca
  secretName: traefik-root-ca
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: traefik-ca
spec:
  ca:
    secretName: traefik-root-ca
