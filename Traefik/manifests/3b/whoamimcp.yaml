# The whoamimcp server and its Service docs-mcp-server on port 8080
# (MCP Gateway, step 1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-mcp-server
  namespace: apps
spec:
  replicas: 1
  selector: { matchLabels: { app: docs-mcp-server } }
  template:
    metadata: { labels: { app: docs-mcp-server } }
    spec:
      containers:
        - name: mcp
          image: traefik/whoamimcp:v0.0.5   # MCP server greeter_s1, tool greet
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: docs-mcp-server
  namespace: apps
spec:
  selector: { app: docs-mcp-server }
  ports: [{ port: 8080, targetPort: 80 }]   # the route uses port 8080
