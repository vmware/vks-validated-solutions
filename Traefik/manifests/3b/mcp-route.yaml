# The IngressRoute docs-mcp-route, which sends mcp.example.com/docs through the
# jwt, mcp and stripPrefix middlewares, in this order (guide 3B, MCP Gateway, step 2).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: docs-mcp-route
  namespace: apps
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`mcp.example.com`) && PathPrefix(`/docs`)
      middlewares:
        - name: docs-mcp-jwt        # 1. authenticate, expose claims
        - name: docs-mcp-gateway    # 2. TBAC on the JSON-RPC call
        - name: docs-strip-prefix   # 3. the server listens on /
      services:
        - name: docs-mcp-server   # the whoamimcp Service
          port: 8080
  tls: {}
