# The jwt middleware docs-mcp-jwt, the mcp middleware docs-mcp-gateway with
# the TBAC policies, and the stripPrefix middleware docs-strip-prefix
# (MCP Gateway, step 2).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: docs-mcp-jwt
  namespace: apps
spec:
  plugin:
    jwt:
      # HS256 key, read from the Secret mcp-jwt-secret
      signingSecret: urn:k8s:secret:mcp-jwt-secret:signingSecret
      # production: jwksUrl or trustedIssuers of the enterprise IdP
      forwardAuthorization: false   # do not send the token upstream
      # sent in the WWW-Authenticate header of a 401 response; equal to
      # the metadata URL of the mcp middleware
      wwwAuthenticate: >-
        https://mcp.example.com/.well-known/oauth-protected-resource/docs
      forwardHeaders:               # JWT claims sent as request headers
        X-User-ID: sub
        X-User-Groups: groups
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: docs-mcp-gateway
  namespace: apps
spec:
  plugin:
    mcp:
      resourceMetadata:             # OAuth protected-resource metadata
        resource: https://mcp.example.com/docs
        authorizationServers:       # your IdP (simulated in this validation)
          - https://idp.example.com
      policies:                     # TBAC rules, evaluated in order
        # each authenticated caller can list the tools
        - match: Equals(`mcp.method`, `tools/list`)
          action: allow
        # only the group "admin" can call the tool greet
        - match: >-
            Equals(`mcp.method`, `tools/call`) &&
            Equals(`mcp.params.name`, `greet`) &&
            Contains(`jwt.groups`, `admin`)
          action: allow
      defaultAction: deny           # deny all other calls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: docs-strip-prefix
  namespace: apps
spec:
  stripPrefix:
    prefixes: [/docs]               # the server listens on /
