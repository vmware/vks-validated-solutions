# The dashboard and its API on websecure, behind the basicAuth middleware dashboard-auth.
# The guide sets matchRule with --set for your domain; this value is the example environment's.
ingressRoute:
  dashboard:
    enabled: true
    matchRule: >-
      Host(`dashboard.example.com`) &&
      (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
    entryPoints: ["websecure"]
    middlewares:
      - name: dashboard-auth
    tls: {}
