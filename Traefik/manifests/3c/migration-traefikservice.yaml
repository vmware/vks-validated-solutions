# The weighted service migration: 90 % to the vCenter estate (child A), 10 % to the
# VM Service estate (child B). A cutover is a change of these two weights.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: migration
  namespace: traefik
spec:
  weighted:
    services:
      - name: vm-app-estate-vcenter@multicluster
        kind: TraefikService
        weight: 90
      - name: vm-app-estate-vmservice@multicluster
        kind: TraefikService
        weight: 10
