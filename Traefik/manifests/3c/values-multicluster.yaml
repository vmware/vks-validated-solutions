# Parent gateway: the multicluster provider with the two children over mutual TLS, and the
# Secret multicluster-mtls mounted on /certs. The children's addresses are set in the guide
# with --set (hub.providers.multicluster.children.<name>.address).
hub:
  providers:
    multicluster:
      enabled: true
      pollInterval: 5
      pollTimeout: 5
      children:
        estate-vcenter:              # child A, in the vCenter estate
          serversTransport:
            rootCAs: [/certs/ca.crt]
            certificates:
              - certFile: /certs/client.crt
                keyFile: /certs/client.key
        estate-vmservice:            # child B, in the VM Service estate
          serversTransport:
            rootCAs: [/certs/ca.crt]
            certificates:
              - certFile: /certs/client.crt
                keyFile: /certs/client.key
deployment:
  additionalVolumes:
    - name: multicluster-mtls
      secret:
        secretName: multicluster-mtls
additionalVolumeMounts:
  - name: multicluster-mtls
    mountPath: /certs
    readOnly: true
