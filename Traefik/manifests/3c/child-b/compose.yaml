# Child B gateway (guide 3C, step 7): Traefik Hub with the vmoperator provider, run by Docker Compose
# from the project folder ~/child-b on the VM. No secret is written in this file: Compose fills
# SUPERVISOR_IP and VSPHERE_NAMESPACE from the .env file next to it into the configuration below,
# mounted read-only for root (mode 0400), and reads the license token and the Supervisor token as
# file secrets (/run/secrets/hub-token, /run/secrets/vmoperator-token).
name: traefik-child-b
services:
  traefik-hub:
    image: ${HUB_CHILD_IMAGE}
    container_name: traefik-hub
    network_mode: host
    restart: unless-stopped
    command: ["--configfile=/etc/traefik-hub/traefik-hub.yaml"]
    volumes:
      - ./dynamic.yaml:/etc/traefik-hub/dynamic.yaml:ro
      - ./mtls-ca.crt:/etc/traefik-hub/certs/ca.crt:ro
      - ./child-b.crt:/etc/traefik-hub/certs/child-b.crt:ro
      - ./child-b.key:/etc/traefik-hub/certs/child-b.key:ro
      - ./vcenter-ca.crt:/etc/traefik-hub/certs/supervisor-ca.crt:ro   # the Supervisor is VMCA-signed
      - traefik-hub-data:/data
    configs:
      - source: traefik-hub
        target: /etc/traefik-hub/traefik-hub.yaml
        mode: 0400
    secrets:
      - hub-token
      - vmoperator-token
configs:
  traefik-hub:
    content: |
      # Traefik Hub static configuration; the variables below come from .env
      hub:
        tokenFilePath: /run/secrets/hub-token
        offline: true                      # offline license token
        providers:
          multicluster: {}                 # Uplink handling on the child
          vmoperator:                      # discover VM Service VMs through the Supervisor API
            endpoint: https://${SUPERVISOR_IP}:443
            tokenFile: /run/secrets/vmoperator-token       # namespace-scoped ServiceAccount token
            tls:
              ca: /etc/traefik-hub/certs/supervisor-ca.crt # vCenter root CAs
            namespaces: ["${VSPHERE_NAMESPACE}"]           # a namespaced token cannot list wider
            apiVersion: v1alpha3
            exposedByDefault: false        # only VMs with traefik.enable=true
            refreshSeconds: 15
            constraints: Label(`traefik.tags`,`vm`)
        uplinkEntryPoints:
          multicluster:                    # the parent polls and forwards here
            address: ":9443"
            asDefault: true
            http:
              tls:
                options: strict-mtls@file  # require the parent's client certificate
      entryPoints:
        traefik:
          address: "127.0.0.1:8080"        # local API, loopback only
      providers:
        file:
          filename: /etc/traefik-hub/dynamic.yaml
      api:
        insecure: true
      log:
        level: INFO
      ping: {}
secrets:
  hub-token:
    file: ./hub-token
  vmoperator-token:
    file: ./vmoperator-token
volumes:
  traefik-hub-data: {}
