# Discovery identity for the vmoperator provider, in the vSphere Namespace
# Apply in the vSphere Namespace (guide 3C, step 7); safe to repeat. If another tool manages these
# objects, skip this file and use that identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-vmoperator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-vmoperator
rules:
  - apiGroups: [vmoperator.vmware.com]
    resources: [virtualmachines]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-vmoperator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-vmoperator
subjects:
  - kind: ServiceAccount
    name: traefik-vmoperator
---
# Long-lived token, filled in asynchronously by the token controller.
apiVersion: v1
kind: Secret
metadata:
  name: traefik-vmoperator-token
  annotations:
    kubernetes.io/service-account.name: traefik-vmoperator
type: kubernetes.io/service-account-token
