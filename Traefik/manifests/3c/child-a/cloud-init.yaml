#cloud-config
# Child A gateway VM: Docker, Docker Compose and the tools the guide uses. guestinfo.userdata is readable by
# anyone who can read the VM, so it carries no secret: only your SSH public key.
users:
  - default
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - REPLACE_ME_SSH_PUBLIC_KEY
package_update: true
packages: [docker.io, docker-compose-v2, jq, curl]
runcmd:
  - systemctl enable --now docker
