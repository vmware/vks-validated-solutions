# Child A gateway (guide 3C, step 6): Traefik Hub with the vsphere provider, run by Docker Compose
# from the project folder ~/child-a on the VM. No secret is written in this file: Compose fills
# VCENTER, VCENTER_USER and VCENTER_PASSWORD from the .env file next to it (mode 0600) into the
# configuration below, mounted read-only for root (mode 0400), and reads the license token as a
# file secret (/run/secrets/hub-token).
name: traefik-child-a
services:
  traefik-hub:
    image: ${HUB_CHILD_IMAGE}
    container_name: traefik-hub
    network_mode: host
    restart: unless-stopped
    command: ["--configfile=/etc/traefik-hub/traefik-hub.yaml"]
    environment:
      SSL_CERT_FILE: /etc/traefik-hub/certs/vcenter-ca.crt   # the vCenter root CAs; the system roots stay in /etc/ssl/certs
    volumes:
      - ./dynamic.yaml:/etc/traefik-hub/dynamic.yaml:ro
      - ./mtls-ca.crt:/etc/traefik-hub/certs/ca.crt:ro
      - ./child-a.crt:/etc/traefik-hub/certs/child-a.crt:ro
      - ./child-a.key:/etc/traefik-hub/certs/child-a.key:ro
      - ./vcenter-ca.crt:/etc/traefik-hub/certs/vcenter-ca.crt:ro
      - traefik-hub-data:/data
    configs:
      - source: traefik-hub
        target: /etc/traefik-hub/traefik-hub.yaml
        mode: 0400
    secrets:
      - hub-token
configs:
  traefik-hub:
    content: |
      # Traefik Hub static configuration; the variables below come from .env
      hub:
        tokenFilePath: /run/secrets/hub-token
        offline: true                      # offline license token
        providers:
          multicluster: {}                 # Uplink handling on the child
          vsphere:                         # discover the VMs through vCenter (read-only)
            endpoint: ${VCENTER}
            username: ${VCENTER_USER}
            password: '${VCENTER_PASSWORD}'
            exposedByDefault: false        # only VMs with traefik.enable=true
            ipMode: private                # backend = guest IP reported by VMware Tools
            refreshSeconds: 15
            constraints: Label(`traefik.tags`,`vm`)
        uplinkEntryPoints:
          multicluster:                    # the parent polls and forwards here
            address: ":9443"
            asDefault: true
            http:
              tls:
                options: strict-mtls@file  # require the parent's client certificate
      entryPoints:
        traefik:
          address: "127.0.0.1:8080"        # local API, loopback only
      providers:
        file:
          filename: /etc/traefik-hub/dynamic.yaml
      api:
        insecure: true
      log:
        level: INFO
      ping: {}
secrets:
  hub-token:
    file: ./hub-token
volumes:
  traefik-hub-data: {}
