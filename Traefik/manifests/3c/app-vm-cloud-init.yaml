#cloud-config
# Application VM (vCenter estate): whoami on port 80, reporting the VM name as "Hostname:".
users:
  - default
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - REPLACE_ME_SSH_PUBLIC_KEY
package_update: true
packages: [docker.io]
runcmd:
  - systemctl enable --now docker
  - docker run -d --restart=always --name whoami --hostname "$(hostname)" -p 80:80 traefik/whoami:v1.11
