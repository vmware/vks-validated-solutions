# Deliberate VKS override: run the collector agent as a non-root user.
#
# The Splunk chart adds an init container which adjusts access to the node log
# directories when both values below are non-zero. This is supported with the
# containerd runtime used by VKS. It is defence in depth; it does not remove the
# need for the namespace's privileged Pod Security Admission level.
agent:
  securityContext:
    runAsUser: 20000
    runAsGroup: 20000
