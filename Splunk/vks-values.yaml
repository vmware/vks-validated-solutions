# Helm override to run the collector agent as a non-root user
#
# The Splunk chart adds an init container which adjusts access to the node log
# directories when both values below are non-zero. 
# 
# This does not remove the need for the namespace's privileged PSA level
agent:
  securityContext:
    runAsUser: 20000
    runAsGroup: 20000

  config:
    receivers:
      kubelet_stats:
        insecure_skip_verify: true
