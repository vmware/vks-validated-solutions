apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-internal-cert
  namespace: vault
spec:
  secretName: vault-tls-secret
  duration: 8760h # 1 year
  renewBefore: 720h
  isCA: true
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: vault-selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
    - vault-internal
    - vault-internal.vault
    - vault-internal.vault.svc
    - vault-internal.vault.svc.cluster.local
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - "*.vault-internal"
    - vault-0.vault-internal
    - vault-1.vault-internal
    - vault-2.vault-internal
    - vault.vtechk8s.com
    - localhost
  ipAddresses:
    - 127.0.0.1