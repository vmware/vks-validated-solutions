#   Helm chart config reference: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/helm/configuration
#   Helm TLS example:            https://developer.hashicorp.com/vault/docs/deploy/kubernetes/helm/examples/standalone-tls
#   Chart pinned to 0.34.1 / Vault 2.0.4 (https://developer.hashicorp.com/vault/docs/deploy/kubernetes/helm/run)
global:
  tlsDisable: false

server:
  image:
    tag: "2.0.4"                      # pin; matches chart 0.34.1

  extraEnvironmentVars:
    # Replaces VAULT_SKIP_VERIFY. Sets the SNI/hostname used to verify the cert
    # when the CLI inside the pod connects to https://127.0.0.1:8200.
    VAULT_TLS_SERVER_NAME: "vault.example.com"
    # Only needed if the cert is NOT from a publicly trusted CA (e.g. private CA):
    VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt

  resources:                          # sizing is an example; set per environment
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 2Gi

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: "<your-storage-class-name>"
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: true                     # volume only; still need `vault audit enable` (see README.md)
    size: 5Gi
    storageClass: "<your-storage-class-name>"

  volumes:
    - name: vault-tls
      secret:
        secretName: vault-tls-secret  # Secret containing your TLS cert/key

  volumeMounts:
    - name: vault-tls
      mountPath: /vault/userconfig/vault-tls
      readOnly: true

  ha:
    enabled: true
    replicas: 3
    apiAddr: "https://vault.example.com:8200"   # must be a name present in the cert's SANs
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        cluster_name = "vault-raft01"

        storage "raft" {
          path = "/vault/data/"

          retry_join {
            leader_api_addr       = "https://vault-0.vault-internal:8200"
            leader_tls_servername = "vault.example.com"
            leader_ca_cert_file   = "/vault/userconfig/vault-tls/ca.crt"
          }
          retry_join {
            leader_api_addr       = "https://vault-1.vault-internal:8200"
            leader_tls_servername = "vault.example.com"
            leader_ca_cert_file   = "/vault/userconfig/vault-tls/ca.crt"
          }
          retry_join {
            leader_api_addr       = "https://vault-2.vault-internal:8200"
            leader_tls_servername = "vault.example.com"
            leader_ca_cert_file   = "/vault/userconfig/vault-tls/ca.crt"
          }
        }

        listener "tcp" {
          address             = "[::]:8200"
          cluster_address     = "[::]:8201"
          tls_cert_file       = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file        = "/vault/userconfig/vault-tls/tls.key"
          tls_min_version     = "tls12"   # default is already tls12; "tls13" is stricter
          tls_reload_interval = "5m"      # picks up rotated Secret without restart/SIGHUP
        }

        service_registration "kubernetes" {}

ui:
  enabled: true
  serviceType: "LoadBalancer"
#  loadBalancerSourceRanges:
#    - <admin-cidr>/32                 # restrict who can reach the UI/API
